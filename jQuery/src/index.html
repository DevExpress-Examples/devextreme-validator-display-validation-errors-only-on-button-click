<!DOCTYPE html>
<html>
  <head>
    <title>DevExtreme jQuery app</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="../node_modules/devextreme-dist/css/dx.material.blue.light.compact.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <script type="text/javascript" src="../node_modules/jquery/dist/jquery.js"></script>
    <script type="text/javascript" src="../node_modules/devextreme-dist/js/dx.all.js"></script>
    <script type="text/javascript" src="./devextreme-license.js"></script>
    <script type="text/javascript" src="index.js"></script>
  </head>

  <body class="dx-viewport">
    <div id="form">
      <div class="dx-fieldset">
        <h2>Application Form</h2>
        <div class="dx-field">
          <div class="dx-field-label">Name</div>
          <div class="dx-field-value">
            <div id="name-validation"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Date of birth</div>
          <div class="dx-field-value">
            <div id="date-validation"></div>
          </div>
        </div>
      </div>
      <div class="dx-fieldset">
        <div class="dx-fieldset-header">Billing address</div>
        <div class="dx-field">
          <div class="dx-field-label">Country</div>
          <div class="dx-field-value">
            <div id="country-validation"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">City</div>
          <div class="dx-field-value">
            <div id="city-validation"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Zip code</div>
          <div class="dx-field-value">
            <div id="zip-code-validation"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Address</div>
          <div class="dx-field-value">
            <div id="address-validation"></div>
          </div>
        </div>
        <div class="dx-field">
          <div class="dx-field-label">Phone <i>(optional)</i></div>
          <div class="dx-field-value">
            <div id="phone-validation"></div>
          </div>
        </div>
      </div>
      <div id="check"></div>
      <div id="summary"></div>
      <div id="button"></div>
    </div>
  </body>
</html>
